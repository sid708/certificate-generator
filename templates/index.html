<!DOCTYPE html>
<html>
<head>
    <title>Certificate Generator</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 50px; }
        input, button { padding: 10px; margin: 10px; width: 250px; }
    </style>
</head>
<body>

<h2>Generate Your Certificate</h2>

<form action="/generate" method="post">
    <input name="name" placeholder="Participant Name" required><br>
    <input name="school" placeholder="School Name" required><br>
    <input name="event" placeholder="Event Name" required><br>
    <input name="email" type="email" placeholder="Email ID" required><br>
    <button type="submit">Download Certificate</button>
</form>


</body>
</html>
