<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Certificate Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #1f2937, #020617);
            font-family: 'Inter', sans-serif;
            color: #e5e7eb;
        }

        .card {
            background: #020617;
            border-radius: 18px;
            padding: 40px 35px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }

        .logo {
            width: 90px;
            height: auto;
            margin-bottom: 20px;
        }

        h2 {
            margin: 0 0 25px;
            font-weight: 700;
            letter-spacing: 0.4px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 16px;
            border-radius: 10px;
            border: none;
            outline: none;
            background: #020617;
            color: #e5e7eb;
            font-size: 15px;
            box-shadow: inset 0 0 0 1px #1f2937;
            transition: all 0.2s ease;
        }

        input::placeholder {
            color: #6b7280;
        }

        input:focus {
            box-shadow: inset 0 0 0 1px #38bdf8;
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(56, 189, 248, 0.35);
        }

        footer {
            margin-top: 25px;
            font-size: 12px;
            color: #6b7280;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Replace this URL with your GitHub-hosted logo -->
        <img src="https://your-username.github.io/your-repo/logo.png" alt="School Logo" class="logo">

        <h2>Generate Certificate</h2>

        <form action="/generate" method="post">
            <input name="name" placeholder="Participant Name" required>
            <input name="school" placeholder="School Name" required>
            <input name="event" placeholder="Event Name" required>
            <input name="email" type="email" placeholder="Email ID" required>

            <button type="submit">Download Certificate</button>
        </form>

        <footer>
            © 2026 Your School Name
        </footer>
    </div>

</body>
</html>
